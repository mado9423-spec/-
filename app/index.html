/* Layout: phone-first app shell (floating dock, push pages, bottom sheets). On wide screens the shell sits in a device frame beside a product story. Dark midnight-ink ground with champagne-gold accent; pastel role tiles carried over from the original Sanad dashboard. */
:root{
  color-scheme:dark;
  --bg:#070b14; --bg-2:#0c1322; --field:rgba(255,255,255,.06); --sheet:#0f1728;
  --surface:rgba(255,255,255,.055); --surface-2:rgba(255,255,255,.09); --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.17);
  --ink:#eef1f7; --ink-2:#c3cbdb; --mute:#8d99ad;
  --gold-text:#ebcb86; --gold-a:#f4dca0; --gold-b:#d1a24d; --gold-c:#9a6b22; --on-gold:#2a1c05;
  --ok:#3ddba9; --warn:#f5b04a; --bad:#ff7088; --info:#8aa6ff;
  --hero-a:#13203e; --hero-b:#0a1122; --hero-ink:#f2f5f8; --hero-mute:#93a0b5; --hero-line:rgba(255,255,255,.11);
  --t-mint:#12382f; --t-mint-ink:#a9f1da; --t-lilac:#27214b; --t-lilac-ink:#d0c3ff;
  --t-peach:#3b2a12; --t-peach-ink:#ffd9a0; --t-sky:#172a55; --t-sky-ink:#bcd2ff;
  --shadow:0 1px 0 rgba(255,255,255,.06) inset,0 18px 40px -24px rgba(0,0,0,.95);
  --blob-a:rgba(233,200,127,.15); --blob-b:rgba(76,111,255,.20); --blob-c:rgba(18,184,134,.13);
  --stage:#04070d; --frame:#1a2336; --dock:rgba(9,14,27,.86); --dock-ink:#8d99ad;
  --scrim:rgba(2,5,10,.58);
  --f-disp:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Readex Pro",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r-card:22px; --r-ctl:14px;
}

html[dir="rtl"]{--start:right;--end:left;--rot-open:-90deg;--slide:-26%}
html[dir="ltr"]{--start:left;--end:right;--rot-open:90deg;--slide:26%}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
body{height:100%;background:var(--stage);color:var(--ink);font:400 14px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold-b);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.num{font-family:var(--f-disp);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.ltr{direction:ltr;unicode-bidi:isolate}
.mono{font-family:var(--f-mono);font-weight:500;direction:ltr;unicode-bidi:isolate;letter-spacing:.2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{display:inline-grid;place-items:center;width:1.25em;height:1.25em;flex:none}
.ico svg{width:100%;height:100%;display:block}

/* ---------- stage + device ---------- */
.stage{height:100%;display:flex;align-items:center;justify-content:center;gap:64px;padding:24px}
.story{width:min(420px,40vw);display:flex;flex-direction:column;gap:22px}
.story .brand{display:flex;align-items:center;gap:12px;font:600 1.5rem var(--f-disp)}
.story h1{font:600 2.3rem/1.3 var(--f-disp);text-wrap:balance;letter-spacing:-.3px}
.story h1 em{font-style:normal;color:var(--gold-text)}
.story p.lead{color:var(--ink-2);font-size:1.02rem;text-wrap:pretty}
.story ul{list-style:none;display:flex;flex-direction:column;gap:14px}
.story li{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
.story li .bx{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--gold-text);font-size:1.1rem}
.story li b{display:block;font:500 .95rem var(--f-disp)}
.story li span{color:var(--mute);font-size:.85rem}
.story .fine{color:var(--mute);font-size:.78rem;border-top:1px solid var(--line);padding-top:14px}
.device{position:relative;width:392px;height:min(844px,100%);border-radius:46px;background:var(--frame);padding:9px;box-shadow:0 0 0 1px var(--line-2),0 50px 90px -30px rgba(0,0,0,.65),0 0 120px -30px color-mix(in srgb,var(--gold-b) 30%,transparent);flex:none}
.app{position:relative;width:100%;height:100%;border-radius:38px;overflow:hidden;background:linear-gradient(180deg,var(--bg),var(--bg-2));isolation:isolate}
.amb{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.amb i{position:absolute;border-radius:50%;filter:blur(70px)}
.amb i:nth-child(1){width:300px;height:300px;background:var(--blob-a);top:-90px;left:-70px;animation:dr1 26s ease-in-out infinite alternate}
.amb i:nth-child(2){width:320px;height:320px;background:var(--blob-b);bottom:-120px;right:-90px;animation:dr2 30s ease-in-out infinite alternate}
.amb i:nth-child(3){width:220px;height:220px;background:var(--blob-c);top:46%;left:40%;animation:dr1 34s ease-in-out infinite alternate-reverse}
@keyframes dr1{to{transform:translate(70px,60px) scale(1.15)}}
@keyframes dr2{to{transform:translate(-70px,-50px) scale(1.2)}}
@media (max-width:980px){.story{display:none}}
@media (max-width:560px){
  .stage{padding:0}
  .device{width:100%;height:100%;border-radius:0;padding:0;box-shadow:none}
  .app{border-radius:0}
}

/* ---------- screens ---------- */
.viewport{position:absolute;inset:0;z-index:1}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:0 18px 120px;scrollbar-width:none;overscroll-behavior:contain}
.screen::-webkit-scrollbar,.page-body::-webkit-scrollbar,.sheet-body::-webkit-scrollbar,.hscroll::-webkit-scrollbar{display:none}
.screen[hidden]{display:none!important}
.stack{display:flex;flex-direction:column;gap:14px}
.sect{display:flex;flex-direction:column;gap:10px}
.sect-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sect-h h2{font:500 1rem var(--f-disp)}
.sect-h .more{color:var(--gold-text);font-size:.8rem;font-weight:500}
.rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}

.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:16px 18px 10px;margin:0 -18px 2px;background:linear-gradient(var(--bg) 60%,transparent)}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo-mark svg{width:72%;height:72%;display:block}
.logo-mark{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;background:linear-gradient(145deg,var(--gold-a),var(--gold-b) 62%,var(--gold-c));color:#1d2549;font:700 1.2rem var(--f-disp);box-shadow:0 8px 20px -8px color-mix(in srgb,var(--gold-b) 70%,transparent),0 1px 0 rgba(255,255,255,.5) inset}
.logo b{display:block;font:600 1.08rem/1.2 var(--f-disp)}
.logo small{display:block;color:var(--mute);font-size:.7rem;line-height:1.2;white-space:nowrap}
.sp{flex:1}
.ibtn{position:relative;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);backdrop-filter:blur(14px);transition:transform .2s,background .2s}
.ibtn:active{transform:scale(.92)}
.ibtn .ico{font-size:1.05rem}
.ibtn .dot{position:absolute;top:8px;inset-inline-end:9px;width:8px;height:8px;border-radius:50%;background:var(--gold-b);box-shadow:0 0 0 2px var(--bg)}
.title-row{display:flex;align-items:center;gap:10px;padding:16px 0 12px}
.title-row h1{font:600 1.45rem var(--f-disp);flex:1}

/* ---------- cards + atoms ---------- */
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:16px;box-shadow:var(--shadow);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);min-width:0}
:where(button.card){display:block;width:100%}
.card.flat{box-shadow:none}
.card.tap{cursor:pointer;transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .2s}
.card.tap:active{transform:scale(.985)}
.card.tint-mint{background:var(--t-mint);color:var(--t-mint-ink);border-color:transparent}
.card.tint-lilac{background:var(--t-lilac);color:var(--t-lilac-ink);border-color:transparent}
.card.tint-peach{background:var(--t-peach);color:var(--t-peach-ink);border-color:transparent}
.card.tint-sky{background:var(--t-sky);color:var(--t-sky-ink);border-color:transparent}
.card.hero{background:radial-gradient(420px 220px at 12% -10%,color-mix(in srgb,var(--gold-b) 26%,transparent),transparent 70%),linear-gradient(165deg,var(--hero-a),var(--hero-b));color:var(--hero-ink);border-color:var(--hero-line);overflow:hidden}
.card.hero .mute,.card.hero .lbl{color:var(--hero-mute)}
.lbl{font-size:.74rem;color:var(--mute);line-height:1.4}
.mute{color:var(--mute)}
.h3{font:500 .92rem var(--f-disp)}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.col{display:flex;flex-direction:column;gap:6px;min-width:0}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.clip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:99px;font-size:.72rem;font-weight:600;white-space:nowrap;line-height:1.6;background:color-mix(in srgb,var(--tone,var(--mute)) 17%,transparent);color:var(--tone,var(--mute))}
.pill .ico{font-size:.85rem}
.pill.ok{--tone:var(--ok)}.pill.warn{--tone:var(--warn)}.pill.bad{--tone:var(--bad)}.pill.info{--tone:var(--info)}.pill.gold{--tone:var(--gold-text)}.pill.idle{--tone:var(--mute)}
.card.hero .pill.ok{--tone:#59e8b8}.card.hero .pill.warn{--tone:#ffc46d}.card.hero .pill.bad{--tone:#ff8da0}.card.hero .pill.gold{--tone:#f1d393}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:.78rem;color:var(--ink-2);white-space:nowrap}
button.chip{transition:background .2s,border-color .2s}
button.chip.on{background:color-mix(in srgb,var(--gold-b) 22%,transparent);border-color:color-mix(in srgb,var(--gold-b) 55%,transparent);color:var(--gold-text)}
.hscroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;margin-inline:-18px;padding:2px 18px 6px;scrollbar-width:none}
.hscroll>*{scroll-snap-align:start;flex:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:var(--r-ctl);font:600 .95rem var(--f-body);transition:transform .15s,filter .2s,background .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(145deg,var(--gold-a),var(--gold-b) 70%,#c0913c);color:var(--on-gold);box-shadow:0 12px 26px -12px color-mix(in srgb,var(--gold-b) 85%,transparent),0 1px 0 rgba(255,255,255,.55) inset}
.btn.gold:hover{filter:brightness(1.05)}
.btn.ghost{background:var(--surface);border:1px solid var(--line-2);color:var(--ink)}
.btn.quiet{background:transparent;color:var(--gold-text);padding:0 8px}
.btn.danger{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.btn.sm{height:38px;padding:0 14px;font-size:.84rem;border-radius:12px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-top:1px dashed var(--line);font-size:.84rem}
.kv:first-child{border-top:0}
.kv span{color:var(--mute)}
.kv b{font:500 .86rem var(--f-disp);text-align:end}
.divider{height:1px;background:var(--line);margin-block:2px}
.note{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:14px;font-size:.8rem;line-height:1.55;background:color-mix(in srgb,var(--tone,var(--info)) 13%,transparent);color:var(--ink-2)}
.note .ico{color:var(--tone,var(--info));font-size:1.1rem;margin-top:1px}
.note.warn{--tone:var(--warn)}.note.bad{--tone:var(--bad)}.note.ok{--tone:var(--ok)}.note.gold{--tone:var(--gold-text)}
.note b{color:var(--ink)}
.empty{text-align:center;color:var(--mute);padding:28px 10px;font-size:.88rem}
.src{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;color:var(--gold-text);text-decoration:none;border-bottom:1px dotted currentColor}

/* confidence tag */
.conf{white-space:nowrap;display:inline-flex;align-items:center;gap:5px;font-size:.68rem;font-weight:600;padding:1px 8px;border-radius:99px;border:1px solid currentColor}
.conf.hi{color:var(--ok)}.conf.mid{color:var(--warn)}.conf.lo{color:var(--bad)}

/* ---------- ring + bars ---------- */
.ringbox{position:relative;display:grid;place-items:center;flex:none}
.ringbox svg{transform:rotate(-90deg);display:block}
.ringbox .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.seg{display:flex;padding:3px;border-radius:99px;background:var(--surface);border:1px solid var(--line);gap:2px}
.seg button{flex:1;padding:6px 12px;border-radius:99px;font-size:.8rem;font-weight:500;color:var(--mute);text-align:center;transition:.25s;white-space:nowrap}
.seg button.on{background:var(--surface-2);color:var(--ink);box-shadow:0 2px 8px -3px rgba(0,0,0,.4)}
.prog{display:flex;gap:4px}
.prog i{flex:1;height:5px;border-radius:9px;background:var(--line-2);position:relative;overflow:hidden}
.prog i.done{background:linear-gradient(var(--grad-dir,90deg),var(--gold-b),var(--gold-a))}
.prog i.cur{background:color-mix(in srgb,var(--gold-b) 40%,var(--line-2))}
.prog i.cur::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:sheen 1.8s infinite}
.prog i.bad{background:var(--bad)}
@keyframes sheen{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.bar{height:6px;border-radius:9px;background:var(--line-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--gold-b),var(--gold-a));width:0;transition:width .9s cubic-bezier(.2,.9,.25,1)}

/* ---------- hero (home) ---------- */
.hero-grid{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;position:relative}
.hero .big{font:600 2.3rem/1 var(--f-disp);letter-spacing:-.5px}
.hero .big small{font-size:1rem;opacity:.55;font-weight:400;margin-inline-start:2px}
.mini3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;position:relative}
.mini3>div{background:rgba(255,255,255,.07);border-radius:14px;padding:9px 11px;min-width:0}
.mini3 b{display:block;font:500 1.05rem var(--f-disp);direction:ltr;text-align:var(--start)}
.mini3 span{font-size:.7rem;color:var(--hero-mute)}

/* alerts */
.alert{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:12px 14px}
.alert .bx{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:1.1rem;background:color-mix(in srgb,var(--tone,var(--info)) 17%,transparent);color:var(--tone,var(--info))}
.alert.bad{--tone:var(--bad)}.alert.warn{--tone:var(--warn)}.alert.info{--tone:var(--info)}.alert.ok{--tone:var(--ok)}.alert.gold{--tone:var(--gold-text)}
.alert b{display:block;font:500 .88rem/1.4 var(--f-body)}
.alert span.s{display:block;font-size:.76rem;color:var(--mute);line-height:1.45}
.alert .go{color:var(--mute);font-size:1.1rem}

/* shipment card */
.ship{width:292px;display:flex;flex-direction:column;gap:12px;padding:16px}
.ship.full{width:auto}
.ship .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ship h4{font:500 1rem/1.35 var(--f-disp)}
.ship .meta{display:flex;gap:6px;align-items:center;font-size:.74rem;color:var(--mute);flex-wrap:wrap}
.ship .next{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:13px;background:var(--surface-2);font-size:.8rem}
.ship .next .ico{color:var(--gold-text)}
.cc{display:inline-grid;place-items:center;min-width:26px;height:20px;padding:0 6px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);font:600 .66rem var(--f-mono);color:var(--ink-2)}

/* tools grid */
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:20px;min-height:104px;text-align:start;transition:transform .2s}
.tool:active{transform:scale(.97)}
.tool .bx{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.4);font-size:1.15rem}
:root[data-theme="dark"] .tool .bx,:root:not([data-theme="light"]) .tool .bx{background:rgba(255,255,255,.1)}
.tool b{font:500 .92rem/1.3 var(--f-disp)}
.tool span{font-size:.73rem;opacity:.8;line-height:1.4}

/* radar */
.radar{display:flex;flex-direction:column}
.rd{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px dashed var(--line)}
.rd:first-child{border-top:0}
.rd .dt{text-align:center;line-height:1.1}
.rd .dt b{display:block;font:600 1.25rem var(--f-disp)}
.rd .dt span{font-size:.68rem;color:var(--mute)}
.rd .t{font-size:.84rem;line-height:1.45}
.rd .t small{display:block;color:var(--mute);font-size:.72rem}
.rd.past .dt b,.rd.past .t{opacity:.55}

/* feed */
.feed{display:flex;flex-direction:column;gap:12px}
.ev{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:start;font-size:.82rem;line-height:1.45}
.ev .bx{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--gold-text);font-size:.95rem}
.ev small{display:block;color:var(--mute);font-size:.72rem}

/* ---------- dock ---------- */
.dock{position:absolute;inset-inline:0;bottom:14px;z-index:30;display:flex;justify-content:center;pointer-events:none}
.dock nav{pointer-events:auto;display:flex;gap:2px;padding:6px;border-radius:99px;background:var(--dock);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid rgba(255,255,255,.12);box-shadow:0 22px 44px -16px rgba(0,0,0,.7)}
.dock button{display:flex;align-items:center;gap:7px;height:46px;min-width:46px;padding:0 13px;border-radius:99px;color:var(--dock-ink);justify-content:center;transition:background .3s,color .3s}
.dock button .ico{font-size:1.25rem}
.dock button span.t{max-width:0;opacity:0;overflow:hidden;white-space:nowrap;font:600 .8rem var(--f-body);transition:max-width .35s cubic-bezier(.2,.9,.25,1),opacity .25s}
.dock button[aria-selected="true"]{background:linear-gradient(145deg,var(--gold-a),var(--gold-b));color:var(--on-gold)}
.dock button[aria-selected="true"] span.t{max-width:80px;opacity:1}
.dock .badge{position:absolute;margin-top:-22px;margin-inline-start:20px;min-width:16px;height:16px;border-radius:99px;background:var(--bad);color:#fff;font:700 .6rem/16px var(--f-disp);text-align:center;padding:0 4px}
.dock button{position:relative}

/* ---------- push pages ---------- */
.page{position:absolute;inset:0;z-index:35;background:linear-gradient(180deg,var(--bg),var(--bg-2));display:flex;flex-direction:column;transform:translateX(var(--slide));opacity:0;transition:transform .42s cubic-bezier(.2,.9,.25,1),opacity .3s;will-change:transform}
.page.in{transform:none;opacity:1}
.page.out{transform:translateX(var(--slide));opacity:0}
.page-head{display:flex;align-items:center;gap:10px;padding:16px 18px 10px;flex:none}
.page-head h1{font:600 1.15rem/1.3 var(--f-disp);flex:1;min-width:0}
.page-body{flex:1;overflow-y:auto;padding:4px 18px 28px;scrollbar-width:none;overscroll-behavior:contain}
.page-foot{flex:none;padding:12px 18px 18px;background:linear-gradient(transparent,var(--bg-2) 35%)}

/* gates (timeline) */
.gates{display:flex;flex-direction:column}
.gate{display:grid;grid-template-columns:30px 1fr;gap:12px;position:relative}
.gate .rail{position:relative;display:flex;flex-direction:column;align-items:center}
.gate .rail::after{content:"";flex:1;width:2px;margin-top:4px;background:var(--line-2);border-radius:2px}
.gate:last-child .rail::after{display:none}
.gate.done .rail::after{background:linear-gradient(var(--gold-b),color-mix(in srgb,var(--gold-b) 35%,var(--line-2)))}
.node{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line-2);background:var(--bg-2);color:var(--mute);font:600 .76rem var(--f-disp);flex:none;z-index:1}
.gate.done .node{background:linear-gradient(145deg,var(--gold-a),var(--gold-b));border-color:transparent;color:var(--on-gold)}
.gate.active .node{border-color:var(--gold-b);color:var(--gold-text);box-shadow:0 0 0 0 color-mix(in srgb,var(--gold-b) 50%,transparent);animation:pulse 2.2s infinite}
.gate.blocked .node{border-color:var(--bad);color:var(--bad);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--gold-b) 55%,transparent)}70%,100%{box-shadow:0 0 0 9px transparent}}
.gate .gcard{margin-bottom:12px;padding:0;overflow:hidden}
.gate .ghead{display:flex;align-items:center;gap:10px;padding:13px 14px;width:100%}
.gate .ghead b{display:block;font:500 .94rem/1.3 var(--f-disp)}
.gate .ghead small{display:block;color:var(--mute);font-size:.72rem;line-height:1.4}
.gate .ghead .chev{color:var(--mute);transition:transform .3s}
.gate.open .ghead .chev{transform:rotate(var(--rot-open))}
.gbody{display:none;padding:0 14px 14px}
.gate.open .gbody{display:block}
.task{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:start;padding:11px 0;border-top:1px dashed var(--line)}
.tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;color:transparent;transition:.25s;margin-top:1px}
.task.done .tick{background:linear-gradient(145deg,var(--gold-a),var(--gold-b));border-color:transparent;color:var(--on-gold)}
.task.auto .tick{border-style:dashed}
.task.warn .tick{border-color:var(--warn)}
.task .tt{font-size:.86rem;line-height:1.5}
.task.done .tt{color:var(--mute)}
.task .th{display:block;font-size:.73rem;color:var(--mute);line-height:1.5;margin-top:1px}
.task .th.w{color:var(--warn)}
.task .acts{display:flex;gap:6px;align-items:center}
.sysbtn{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:600;color:var(--gold-text);padding:3px 9px;border-radius:99px;border:1px solid color-mix(in srgb,var(--gold-b) 45%,transparent);text-decoration:none;white-space:nowrap}
.sim{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.sim button{font-size:.72rem;padding:4px 10px;border-radius:99px;border:1px dashed var(--line-2);color:var(--mute)}
.sim button:active{background:var(--surface-2)}

/* ---------- LC ---------- */
.lc{display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:center;padding:13px 14px;width:100%}
.lc .no{font:600 .92rem var(--f-disp);direction:ltr}
.lc .ds{font-size:.78rem;color:var(--mute);min-width:0}
.lc .am{font:500 .92rem var(--f-disp);direction:ltr;text-align:var(--end)}
.lc .pb{grid-column:1/-1;margin-top:6px}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-block:4px 8px}
.rg{text-align:center}
.rg small{display:block;font-size:.7rem;color:var(--mute);margin-top:4px;line-height:1.35}
.bkcards{display:flex;gap:10px;overflow-x:auto;margin-inline:-18px;padding:4px 18px 10px;scroll-snap-type:x proximity;scrollbar-width:none}
.bk{flex:0 0 188px;height:106px;border-radius:20px;padding:12px 14px;scroll-snap-align:start;position:relative;overflow:hidden;color:#0f1a14;transition:transform .3s cubic-bezier(.2,.8,.2,1);outline:2px solid transparent;outline-offset:3px}
.bk.sel{outline-color:var(--gold-b)}
.bk::after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.26);top:-84px;inset-inline-start:-40px;pointer-events:none}
.bk small{display:block;font-size:.66rem;opacity:.75;position:relative}
.bk .n{font:600 .84rem var(--f-disp);position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk .b{position:absolute;bottom:11px;inset-inline:14px;font:600 1.05rem var(--f-disp);direction:ltr;text-align:var(--end)}
.bk .b small{display:inline;font-size:.64rem}
.g1{background:linear-gradient(135deg,#f6dea0,#e0b062 60%,#b98430)}
.g2{background:linear-gradient(135deg,#a5f0d6,#3fce9f 60%,#16906e);color:#032b21}
.g3{background:linear-gradient(135deg,#b7cbff,#6d8cff 60%,#3552d8);color:#07154a}
.g4{background:linear-gradient(135deg,#566072,#262e3c 60%,#0f141c);color:#f2f5f8}
.g5{background:linear-gradient(135deg,#ffc2cf,#f2778f 60%,#c1405b);color:#40091a}
.g6{background:linear-gradient(135deg,#d9c9ff,#a487f7 60%,#6a49d1);color:#20104f}
.don{position:relative;width:128px;height:128px;flex:none}
.don svg{width:100%;height:100%;transform:rotate(-90deg)}
.don circle{fill:none;stroke-width:15;stroke-linecap:round;transition:stroke-dasharray 1.1s cubic-bezier(.2,.9,.25,1),stroke-width .25s,opacity .25s}
.don .ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.leg{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.leg div{display:flex;align-items:center;gap:7px;font-size:.74rem}
.leg i{width:9px;height:9px;border-radius:3px;flex:none}

/* ---------- forms ---------- */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.w2{grid-column:1/-1}
.field>label{font-size:.76rem;color:var(--mute);font-weight:500}
.field>label b{color:var(--bad)}
.field input,.field select,.field textarea{width:100%;height:46px;background:var(--field);border:1px solid var(--line);border-radius:var(--r-ctl);padding:0 13px;outline:none;transition:border-color .2s,box-shadow .2s;min-width:0;font-size:.9rem;appearance:none;-webkit-appearance:none}
.field textarea{height:auto;min-height:84px;padding:11px 13px;resize:vertical}
.field select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1.5 6 6.5 11 1.5' fill='none' stroke='%238d99ad' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");background-repeat:no-repeat;background-position:left 14px center;background-size:12px 8px;padding-left:38px}
html[dir="ltr"] .field select{background-position:right 14px center;padding-left:13px;padding-right:38px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold-b);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold-b) 26%,transparent)}
.field.bad input,.field.bad select{border-color:var(--bad);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 20%,transparent)}
.field .hint{font-size:.7rem;color:var(--mute)}
.field .hint.bad{color:var(--bad)}
.field .u{position:relative}
.field .u b{position:absolute;top:50%;transform:translateY(-50%);left:13px;font:600 .66rem var(--f-disp);color:var(--gold-text);pointer-events:none}
.field .u input{padding:0 13px 0 52px;direction:ltr;text-align:right}
.field input.calc{background:var(--surface-2);font-weight:600;font-family:var(--f-disp);direction:ltr;text-align:end}
.field input[type=date]{direction:ltr;text-align:end}
.field input.ltr,.field input.num{direction:ltr;text-align:end}
.stepper{display:flex;gap:6px;margin-bottom:14px}
.stepper i{flex:1;height:4px;border-radius:9px;background:var(--line-2);transition:background .3s}
.stepper i.on{background:linear-gradient(90deg,var(--gold-b),var(--gold-a))}
.radio{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;padding:12px 14px;border-radius:16px;background:var(--field);border:1px solid var(--line);text-align:start;transition:.2s}
.opt .rd-dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line-2);margin-top:2px;position:relative}
.opt.on{border-color:var(--gold-b);background:color-mix(in srgb,var(--gold-b) 12%,var(--field))}
.opt.on .rd-dot{border-color:var(--gold-b)}
.opt.on .rd-dot::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--gold-b)}
.opt b{display:block;font:500 .9rem/1.4 var(--f-body)}
.opt span{display:block;font-size:.76rem;color:var(--mute);line-height:1.5}

/* cover panel */
.cvp{border-radius:20px;padding:16px;background:linear-gradient(165deg,var(--hero-a),var(--hero-b));color:var(--hero-ink);border:1px solid var(--hero-line)}
.cvp .v{font:600 1.9rem/1.1 var(--f-disp);direction:ltr;text-align:var(--start);margin:4px 0 10px}
.cvp .v small{font-size:.9rem;opacity:.55;font-weight:400}
.cvp .kv{border-color:var(--hero-line)}.cvp .kv span{color:var(--hero-mute)}
.cvp .bar{background:rgba(255,255,255,.12)}

/* swipe */
.swipe{position:relative;height:54px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line-2);overflow:hidden;direction:ltr;user-select:none;touch-action:none}
.swipe .fill{position:absolute;inset:0 0 0 auto;width:0;background:linear-gradient(270deg,var(--gold-c),var(--gold-b));opacity:.55}
.swipe .tx{position:absolute;inset:0;display:grid;place-items:center;font-size:.86rem;color:var(--ink-2);pointer-events:none;animation:nudge 2.4s ease-in-out infinite;direction:rtl;padding-inline:62px}
@keyframes nudge{50%{transform:translateX(-7px)}}
.swipe.fwd .tx{animation-name:nudge2}
.swipe.fwd .fill{inset:0 auto 0 0;background:linear-gradient(90deg,var(--gold-c),var(--gold-b))}
.swipe.fwd .th{right:auto;left:4px}
@keyframes nudge2{50%{transform:translateX(7px)}}
.swipe .th{position:absolute;top:4px;right:4px;width:44px;height:44px;border-radius:50%;background:linear-gradient(145deg,var(--gold-a),var(--gold-b));color:var(--on-gold);display:grid;place-items:center;cursor:grab;touch-action:none;box-shadow:0 8px 18px -6px rgba(0,0,0,.55);font-size:1.15rem}
.swipe.done .th{background:var(--ok);color:#04261b}
.swipe.done .tx{animation:none}

/* ---------- sheet ---------- */

function icon(name, cls = '') {
  if (ICON_ALIAS[name]) name = ICON_ALIAS[name]();
  const el = document.createElement('span');
  el.className = 'ico' + (cls ? ' ' + cls : '');
  el.setAttribute('aria-hidden', 'true');
  el.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ''}</svg>`;

}

/* ---------- letters of credit ---------- */
function calcLC(l) {
  const lyd = l.usd * l.rate;
  const req = (lyd * l.cover) / 100;
  const due = addDays(D(l.open), l.days);
  const inv = sum(l.invoices || []);
  const out = l.status === 'closed' ? 0 : Math.max(0, req - l.paid);
  return { lyd, req, out, due, left: daysBetween(TODAY, due), inv, max: l.usd * (1 + l.dev / 100), invPct: l.usd ? inv / l.usd : 0, elapsed: clamp(daysBetween(D(l.open), TODAY) / l.days, 0, 1) };
}
function lcStatus(l) {
  const c = calcLC(l);
  if (l.status === 'closed') return [tr('مقفل', 'Closed'), 'idle'];
  if (l.status === 'draft') return [tr('مسودة', 'Draft'), 'idle'];
  if (l.status === 'submitted') return [tr('لدى المصرف', 'With the bank'), 'info'];
  if (l.status === 'awaiting_cover') return [tr('بانتظار تغطية المركزي', 'Waiting for CBL cover'), 'warn'];
  if (c.out > 0) return [tr('تغطية نقدية مستحقة', 'Cash cover due'), 'bad'];
  if (c.left < 0) return [tr('منتهي', 'Expired'), 'bad'];
  if (c.left <= 7) return [tr('ينتهي قريبًا', 'Ending soon'), 'warn'];
  return [tr('صادر', 'Issued'), 'ok'];
}
const ceilingFromTax = (income, payroll) => 30 * num(income) + 10 * num(payroll);
const SECTORS = { commercial: T2('تجاري', 'Commercial'), industrial: T2('صناعي', 'Industrial'), services: T2('خدمات', 'Services') };
const sectorName = (s) => L(SECTORS[s] || SECTORS.commercial);

/* ---------- shipment journey engine ---------- */
const GATE_META = [
  { id: 'fund', n: T2('التمويل المصرفي', 'Bank funding'), sub: T2('القناة والاعتماد وتغطية المركزي', 'Channel, credit and CBL cover'), ic: 'bank' },
  { id: 'docs', n: T2('المستندات المسبقة', 'Pre-shipment documents'), sub: T2('فاتورة وتفتيش وتأمين ومنشأ', 'Invoice, inspection, insurance, origin'), ic: 'file' },
  { id: 'aci', n: T2('ACI قبل الشحن', 'ACI before shipping'), sub: T2('التسجيل المسبق للشحنة لدى الجمارك', 'Advance registration with Customs'), ic: 'shield' },
  { id: 'ship', n: T2('الشحن والوصول', 'Shipping & arrival'), sub: T2('السفينة والمانيفست ووصول الحاويات', 'Vessel, manifest and container arrival'), ic: 'ship' },
  { id: 'cus', n: T2('التخليص والإفراج', 'Clearance & release'), sub: T2('الإقرار الجمركي وإثبات القيمة', 'Declaration and proof of value'), ic: 'stamp' },
  { id: 'set', n: T2('التسوية', 'Settlement'), sub: T2('مطابقة المستندات وإقفال الاعتماد', 'Document match and closing the credit'), ic: 'check' },
];
const DOC_OWNER = { invoice: 'supplier', inspection: 'supplier', insurance: 'me', origin: 'supplier', packing: 'supplier', conformity: 'supplier' };

function buildGates(sh) {
  const lc = lcOf(sh);
  const cat = catOf(sh.cat);
  const a = sh.aci;
  const ai = aciIndex(a.status);
  const man = (id) => !!(sh.manual && sh.manual[id]);
  const has = (t) => !!(sh.docs && sh.docs[t]);
  const rel = !!(sh.customs && sh.customs.released);
  const isLC = sh.channel === 'LC';
  const T = {};

  T.fund = [{ id: 'fund.channel', label: tr('تحديد القناة المصرفية', 'Choose the banking channel'), hint: isLC ? tr('اعتماد مستندي عبر مصرفك التجاري', 'Documentary credit through your commercial bank') : sh.channel === 'SOLE' ? tr('نشاط فردي ضمن السقف السنوي', 'Sole trader within the annual limit') : tr('تحويل مباشر عبر FCMS', 'Direct transfer through FCMS'), kind: 'auto', who: 'system', done: !!sh.channel }];
  if (isLC) {
    T.fund.push(
      { id: 'fund.bank', label: tr('فتح الاعتماد لدى المصرف التجاري', 'Open the credit at your bank'), hint: lc ? tr(`الاعتماد ${lc.no} · ${bankName(lc.bank)}`, `Credit ${lc.no} · ${bankName(lc.bank)}`) : tr('لم يُربط اعتماد بهذه الرحلة بعد', 'No credit is linked to this shipment yet'), kind: 'lc', who: lc && lcIndex(lc.status) >= 1 ? 'bank' : 'me', done: !!lc && lcIndex(lc.status) >= 1 },
      { id: 'fund.cover', label: tr('تغطية المركزي بالنقد الأجنبي', 'Central Bank foreign-currency cover'), hint: tr('يطلبها المصرف من المركزي عبر FCMS', 'Your bank requests it from the Central Bank through FCMS'), kind: 'auto', who: 'bank', sys: 'fcms', done: !!lc && lcIndex(lc.status) >= 3 },
    );
  } else {
    T.fund.push({ id: 'fund.transfer', label: sh.channel === 'SOLE' ? tr('توثيق التحويل وقيمة الشحنة', 'Document the transfer and shipment value') : tr('طلب التحويل المباشر في FCMS', 'Request the direct transfer in FCMS'), hint: sh.channel === 'SOLE' ? tr('السداد عبر القناة المصرفية وتوثيق القيمة', 'Pay through a banking channel and document the value') : tr('قسم Direct Transfers · حتى 100 ألف$ (المنشور 14/2026)', 'Direct Transfers section · up to USD 100K (Circular 14/2026)'), kind: 'manual', who: 'me', sys: 'fcms', done: man('fund.transfer') });
  }

  const docTypes = PRE_DOCS.concat(cat.conf ? ['conformity'] : []);
  T.docs = docTypes.map((t) => ({
    id: 'docs.' + t, label: docName(t),
    hint: t === 'conformity' ? tr(`مطلوبة لفئة «${catName(sh.cat)}» (ARN 2020/68)`, `Required for “${catName(sh.cat)}” (ARN 2020/68)`) : docHint(t),
    kind: 'doc', docType: t, done: has(t), who: DOC_OWNER[t] || 'supplier',
  }));

  T.aci = [
    { id: 'aci.1', label: tr('المورد يسجّل البيانات الأولية والفاتورة', 'Supplier enters the first data and invoice'), hint: a.note && ai <= 0 ? tr(`أُعيدت للمورد: ${a.note}`, `Returned to the supplier: ${a.note}`) : tr('الرقم الضريبي، الرمز الإحصائي لك، بلد التصدير، الفاتورة', 'Tax ID, your statistical code, country of export, invoice'), kind: 'aci', who: 'supplier', done: ai >= 1, sys: 'aci' },
    { id: 'aci.2', label: tr('مراجعتك وموافقتك على بيانات المورد', 'You review and approve the supplier data'), hint: tr('يصلك بريد من ACI. وافق أو ارفض مع رسالة.', 'You get an email from ACI. Approve or reject with a message.'), kind: 'aci', who: 'me', done: ai >= 2, sys: 'aci' },
    { id: 'aci.3', label: tr('المورد يستكمل النقل والأصناف والحاويات', 'Supplier completes transport, items and containers'), hint: a.note && ai === 2 ? tr(`استفسار الجمارك: ${a.note}`, `Customs query: ${a.note}`) : tr('IMO، الحجز، رمز HS، أرقام الحاويات والأختام', 'IMO, booking, HS code, container and seal numbers'), kind: 'aci', who: 'supplier', done: ai >= 3 },
    { id: 'aci.4', label: tr('مراجعة الجمارك وإصدار رقم ACI', 'Customs review and ACI number'), hint: tr('موافقة أو رفض أو استفسار', 'Approval, rejection or a query'), kind: 'aci', who: 'customs', done: ai >= 4 },
    { id: 'aci.5', label: tr('رقم ACI في بوليصة الشحن ومراجعتها', 'ACI number on the bill of lading, and its review'), hint: a.number ? tr(`رقم ACI: ${a.number}`, `ACI number: ${a.number}`) : tr('يسلّم المورد الرقم للناقل قبل إصدار البوليصة النهائية', 'The supplier gives the number to the carrier before the final bill of lading'), kind: 'aci', who: 'supplier', done: ai >= 6 },
  ];

  T.ship = [
    { id: 'ship.booking', label: tr('حجز الشحن وبيانات السفينة', 'Freight booking and vessel details'), hint: sh.vessel ? `${sh.vessel} · IMO ${sh.imo || '—'}` : tr('تُدخل مع بيانات ACI (النقل)', 'Entered with the ACI transport data'), kind: 'aci', who: 'supplier', done: !!(sh.booking && sh.vessel) },
    { id: 'ship.notice', label: tr('إشعار وصول السفينة والمانيفست', 'Vessel arrival notice and manifest'), hint: tr('يقدمه الوكيل الملاحي عبر E-Logistic (طرابلس والخمس)', 'Filed by the shipping agent in E-Logistic (Tripoli and Khoms)'), kind: 'manual', who: 'agent', sys: 'elogistic', done: !!sh.noticeFiled },
    { id: 'ship.arrive', label: tr('وصول الشحنة إلى الميناء', 'Cargo arrives at the port'), hint: sh.arrived ? tr(`وصلت في ${fmtDate(D(sh.arrived))}`, `Arrived on ${fmtDate(D(sh.arrived))}`) : sh.eta ? tr(`المتوقع ${fmtDay(D(sh.eta))} · ${inDays(daysBetween(TODAY, D(sh.eta)))}`, `Expected ${fmtDay(D(sh.eta))} · ${inDays(daysBetween(TODAY, D(sh.eta)))}`) : '', kind: 'auto', who: 'system', done: !!sh.arrived },
  ];

  T.cus = [
    { id: 'cus.decl', label: tr('الإقرار الجمركي', 'Customs declaration'), hint: tr('يقدمه المخلّص الجمركي (E-Custom)', 'Filed by your clearing agent (E-Custom)'), kind: 'doc', docType: 'declaration', sys: 'ecustom', who: 'agent', done: has('declaration') },
    { id: 'cus.value', label: tr('إثبات القيمة الفعلية للشحنة', 'Proof of the shipment’s actual value'), hint: tr('شرط في القرار 449 قبل التخليص: الفاتورة النهائية وإثبات التحويل أو الاعتماد', 'Required by Decision 449 before clearance: final invoice and proof of transfer or credit'), kind: 'doc', docType: 'valueProof', who: 'me', done: has('valueProof'), key: true },
  ];
  if (cat.conf) T.cus.push({ id: 'cus.conf', label: tr('الرقابة الفنية والمطابقة', 'Technical control and conformity'), hint: tr(`فئة «${catName(sh.cat)}» قد تخضع لفحص المطابقة عند الوصول`, `“${catName(sh.cat)}” may be subject to a conformity check on arrival`), kind: 'manual', who: 'me', done: man('cus.conf') });
  T.cus.push({ id: 'cus.release', label: tr('الإفراج الجمركي', 'Customs release'), hint: tr('تضع الجمارك علامة «مفرج عنه» في ACI', 'Customs marks it “Released” in ACI'), kind: 'manual', who: 'customs', done: rel });

  T.set = [
    { id: 'set.match', label: tr('مطابقة المستندات وتسديد المصرف', 'Documents matched and bank settled'), hint: tr('يطابق المصرف الفاتورة مع شهادة التفتيش', 'The bank matches the invoice with the inspection certificate'), kind: 'manual', who: 'bank', done: man('set.match') },
    { id: 'set.close', label: isLC ? tr('إقفال الاعتماد', 'Close the credit') : tr('إقفال الملف', 'Close the file'), hint: isLC && lc ? tr(`الاعتماد ${lc.no}`, `Credit ${lc.no}`) : '', kind: isLC ? 'auto' : 'manual', who: isLC ? 'bank' : 'me', done: isLC ? !!lc && lc.status === 'closed' : man('set.close') },
  ];

  let active = -1;
  const gates = GATE_META.map((m, i) => {
    const tasks = T[m.id];
    const done = tasks.every((t) => t.done);
    if (!done && active < 0) active = i;
    return { id: m.id, name: L(m.n), sub: L(m.sub), ic: m.ic, i, tasks, done, ndone: tasks.filter((t) => t.done).length };
  });
  gates.forEach((g) => { g.state = g.done ? 'done' : g.i === active ? 'active' : 'todo'; });

  const cus = gates[4];
  if (sh.arrived && !has('valueProof') && !rel) {
    cus.blocked = true;
    cus.blockMsg = tr('وصلت الشحنة ولن تُفرج الجمارك قبل تقديم ما يثبت قيمتها الفعلية (القرار 449).', 'The cargo has arrived and Customs will not release it until you provide proof of its actual value (Decision 449).');
    if (cus.state !== 'done') cus.state = 'active';
    gates.forEach((g) => { if (g.i < 4 && !g.done) g.state = 'active'; });
  }
  const dl = aciRisk(sh);
  if (dl) gates[2].risk = dl;
  return gates;
}

function shipSummary(sh) {
  const gates = buildGates(sh);
  const rel = !!(sh.customs && sh.customs.released);
  const allDone = gates.every((g) => g.done);
  const cur = gates.find((g) => g.state === 'active') || gates[gates.length - 1];
  const blocked = gates.some((g) => g.blocked);
  const tasks = gates.flatMap((g) => g.tasks);
  const pct = Math.round((tasks.filter((t) => t.done).length / tasks.length) * 100);
  /* what is on the user right now: open "me" tasks up to and including the active gate (+ the ACI approval when pending) */
  const todo = [];
  gates.forEach((g) => { if (g.i <= cur.i) g.tasks.forEach((t) => { if (!t.done && t.who === 'me') todo.push({ ...t, gate: g.id }); }); });
  if (sh.aci.status === 'importer_review' && !todo.find((t) => t.id === 'aci.2')) todo.unshift({ ...gates[2].tasks[1], gate: 'aci' });
  todo.sort((x, y) => (y.id === 'aci.2') - (x.id === 'aci.2') || (y.key ? 1 : 0) - (x.key ? 1 : 0));
  const waiting = cur.tasks.filter((t) => !t.done && t.who !== 'me' && t.who !== 'system');
  const next = todo[0] || cur.tasks.find((t) => !t.done) || null;
  let label, tone;
  if (allDone) { label = tr('مكتملة', 'Complete'); tone = 'idle'; }
  else if (rel) { label = tr('تمت التسوية', 'Settled'); tone = 'ok'; }
  else if (blocked) { label = tr('متوقفة عند الإفراج', 'Stuck at release'); tone = 'bad'; }
  else if (todo.length) { label = tr('بانتظارك', 'Waiting for you'); tone = 'gold'; }
  else { label = cur.name; tone = 'info'; }
  return { gates, cur, next, todo, waiting, blocked, pct, label, tone, allDone, mine: todo.length > 0 };
}

/* ACI must be validated >= 48h before loading (carrier advisory) */
function aciRisk(sh) {
  if (aciIndex(sh.aci.status) >= aciIndex('awaiting_bl')) return null;
  if (!sh.etd) return null;
  const dead = addDays(D(sh.etd), -2);
  const left = daysBetween(TODAY, dead);
  if (daysBetween(TODAY, D(sh.etd)) < 0) return { left, dead, tone: 'bad', text: tr('تجاوزت موعد التحميل دون رقم ACI', 'Loading date passed without an ACI number') };
  return { left, dead, tone: left <= 2 ? 'bad' : left <= 7 ? 'warn' : 'info', text: left < 0 ? tr('فات موعد اعتماد ACI (48 ساعة قبل التحميل)', 'ACI deadline missed (48 hours before loading)') : tr(`آخر موعد لاعتماد رقم ACI ${inDays(left)}`, `ACI number deadline ${inDays(left)}`) };
}

/* ---------- company readiness + alerts ---------- */
function reqState(id) { return S.profile.find((p) => p.id === id); }
function readiness() {
  const total = S.profile.length;
  const done = S.profile.filter((p) => p.done).length;
  return { total, done, pct: total ? Math.round((done / total) * 100) : 0 };
}
function docStatus(d) {
  if (!d.exp) return { tone: 'ok', text: tr('ساري', 'Valid'), days: null };
  const left = daysBetween(TODAY, D(d.exp));
  if (left < 0) return { tone: 'bad', text: tr(`منتهٍ ${inDays(left)}`, `Expired ${inDays(left)}`), days: left };
  if (left <= 30) return { tone: 'warn', text: tr(`ينتهي ${inDays(left)}`, `Expires ${inDays(left)}`), days: left };
  return { tone: 'ok', text: tr(`ساري · ${fmtDate(D(d.exp))}`, `Valid · ${fmtDate(D(d.exp))}`), days: left };
}
const COMPANY_DOC_TYPES = [
  { v: 'license', n: T2('رخصة النشاط', 'Business license') },
  { v: 'tax', n: T2('شهادة الضرائب', 'Tax certificate') },
  { v: 'ss', n: T2('شهادة الضمان الاجتماعي', 'Social security certificate') },
  { v: 'pts', n: T2('شهادة تسجيل PTS', 'PTS registration certificate') },
  { v: 'aci', n: T2('إثبات تسجيل ACI', 'ACI registration proof') },
  { v: 'cblkey', n: T2('خطاب مفتاح المركزي وIBAN', 'CBL Key and IBAN letter') },
];
const companyDocName = (type) => { const t = COMPANY_DOC_TYPES.find((x) => x.v === type); return t ? L(t.n) : type; };
/* license / tax / social security follow their documents when uploaded */
function syncProfileFromDocs() {
  ['license', 'tax', 'ss'].forEach((id) => {
    const d = S.companyDocs.find((x) => x.type === id);
    const p = reqState(id);
    if (!d || !p) return;
    const ok = docStatus(d).tone !== 'bad';
    p.done = ok; p.note = ok ? '' : T2('منتهية', 'Expired');
  });
}
function nextRegDate() {
  return REG_DATES.map((r) => ({ ...r, left: daysBetween(TODAY, D(r.date)) })).find((r) => r.left >= 0) || null;
}
const TONE_RANK = { bad: 0, warn: 1, gold: 2, info: 3, ok: 4 };
function buildAlerts() {
  const out = [];
  S.ships.forEach((sh) => {
    const sm = shipSummary(sh);
    const t = shipTitle(sh);
    if (sh.aci.status === 'importer_review') out.push({ tone: 'gold', ic: 'mail', title: tr(`بانتظار موافقتك · ${sh.id}`, `Waiting for your approval · ${sh.id}`), sub: tr(`المورد أدخل بيانات ACI لشحنة «${t}». راجعها ووافق أو ارفض.`, `The supplier entered the ACI data for “${t}”. Review it, then approve or reject.`), act: { type: 'ship', id: sh.id, open: 'aci-approve' } });
    if (sm.blocked) out.push({ tone: 'bad', ic: 'alert', title: tr(`${sh.id} متوقفة عند الإفراج`, `${sh.id} is stuck at release`), sub: tr('لا إفراج قبل مستندات إثبات القيمة الفعلية.', 'No release before proof of the actual value.'), act: { type: 'ship', id: sh.id, open: 'gate-cus' } });
    const r = aciRisk(sh);
    if (r && r.tone !== 'info' && sh.aci.status !== 'importer_review') out.push({ tone: r.tone, ic: 'clock', title: `${sh.id}: ${r.text}`, sub: tr(`حالة ACI الآن: ${aciLabel(sh.aci.status)}`, `ACI status now: ${aciLabel(sh.aci.status)}`), act: { type: 'ship', id: sh.id, open: 'gate-aci' } });
    else if (r && r.tone !== 'info') out.push({ tone: r.tone, ic: 'clock', title: tr(`موعد ACI: ${r.text}`, `ACI deadline: ${r.text}`), sub: tr(`${sh.id} · المغادرة ${fmtDay(D(sh.etd))}`, `${sh.id} · departs ${fmtDay(D(sh.etd))}`), act: { type: 'ship', id: sh.id, open: 'gate-aci' } });
  });
  S.profile.filter((p) => !p.done).slice(0, 2).forEach((p) => out.push({ tone: 'warn', ic: 'shield', title: tr(`أكمل: ${L(REQS[p.id].n)}`, `Complete: ${L(REQS[p.id].n)}`), sub: (p.note ? L(p.note) + '. ' : '') + L(REQS[p.id].why), act: { type: 'profile', id: p.id } }));
  S.companyDocs.forEach((d) => {
    const st = docStatus(d);
    const nm = companyDocName(d.type);
    if (st.tone === 'bad') out.push({ tone: 'bad', ic: 'file', title: `${nm} ${st.text}`, sub: tr('مطلوبة عند فتح الاعتماد. حدّثها قبل الطلب القادم.', 'Needed when opening a credit. Renew it before the next request.'), act: { type: 'docs' } });
    else if (st.tone === 'warn') out.push({ tone: 'warn', ic: 'file', title: `${nm} ${st.text}`, sub: tr('جدّدها مبكرًا لتفادي تعطيل الاعتماد.', 'Renew early to avoid delaying the credit.'), act: { type: 'docs' } });
  });
  S.lcs.filter((l) => l.status !== 'closed').forEach((l) => {
    const c = calcLC(l);
    if (l.status === 'issued' && c.out > 0) out.push({ tone: 'warn', ic: 'bank', title: tr(`تغطية نقدية مستحقة · ${l.no}`, `Cash cover due · ${l.no}`), sub: tr(`${nf(c.out)} د.ل لدى ${bankName(l.bank)}`, `${nf(c.out)} LYD at ${bankName(l.bank)}`), act: { type: 'lc', no: l.no } });
    if (l.status === 'issued' && c.left >= 0 && c.left <= 7) out.push({ tone: 'warn', ic: 'clock', title: tr(`الاعتماد ${l.no} ينتهي ${inDays(c.left)}`, `Credit ${l.no} ends ${inDays(c.left)}`), sub: tr('تأكد من تقديم المستندات قبل الانتهاء.', 'Make sure the documents are presented before it ends.'), act: { type: 'lc', no: l.no } });
  });
  const nr = nextRegDate();
  if (nr && nr.left <= 120) out.push({ tone: nr.tone === 'bad' ? 'warn' : 'info', ic: 'cal', title: L(nr.n), sub: `${fmtDate(D(nr.date))} · ${inDays(nr.left)} · ${L(nr.src)}`, act: { type: 'radar' } });
  out.sort((x, y) => TONE_RANK[x.tone] - TONE_RANK[y.tone]);
  return out;
}

/* The single most useful thing to do now (drives the Home hero) */
function nextStep() {
  const blocked = S.ships.map((s) => ({ s, sm: shipSummary(s) })).find((x) => x.sm.blocked);
  if (blocked) return { tone: 'bad', ic: 'alert', title: tr(`${blocked.s.id} تنتظر إثبات القيمة`, `${blocked.s.id} needs proof of value`), why: tr('وصلت الشحنة ولن تُفرج الجمارك قبل تقديم ما يثبت قيمتها الفعلية.', 'The cargo arrived and Customs will not release it before you prove its actual value.'), label: tr('أرفق مستندات القيمة', 'Add proof of value'), act: { type: 'ship', id: blocked.s.id, open: 'gate-cus' } };
  const pend = S.ships.find((s) => s.aci.status === 'importer_review');
  if (pend) return { tone: 'gold', ic: 'mail', title: tr(`وافق على بيانات ACI للشحنة ${pend.id}`, `Approve the ACI data for ${pend.id}`), why: tr('المورد أدخل البيانات وينتظر موافقتك ليكمل. ACI لازم قبل التحميل.', 'The supplier entered the data and is waiting for you. ACI is needed before loading.'), label: tr('راجع ووافق', 'Review and approve'), act: { type: 'ship', id: pend.id, open: 'aci-approve' } };
  const miss = S.profile.find((p) => !p.done);
  if (miss) return { tone: 'gold', ic: 'shield', title: L(REQS[miss.id].n), why: `${L(REQS[miss.id].why)} ${L(REQS[miss.id].how)}`, label: tr('اعرف كيف', 'See how'), act: { type: 'profile', id: miss.id } };
  const bad = S.companyDocs.find((d) => docStatus(d).tone === 'bad');
  if (bad) return { tone: 'warn', ic: 'file', title: tr(`جدّد ${companyDocName(bad.type)}`, `Renew your ${companyDocName(bad.type)}`), why: tr('منتهية الصلاحية وتُطلب عند كل اعتماد.', 'It has expired and is requested for every credit.'), label: tr('حدّث المستند', 'Update the document'), act: { type: 'docs' } };
  const live = S.ships.map((s) => ({ s, sm: shipSummary(s) })).find((x) => !x.sm.allDone && x.sm.todo.length);
  if (live) return { tone: 'gold', ic: 'box', title: live.sm.todo[0].label, why: tr(`الرحلة ${live.s.id} · ${shipTitle(live.s)}`, `Shipment ${live.s.id} · ${shipTitle(live.s)}`), label: tr('افتح الرحلة', 'Open the shipment'), act: { type: 'ship', id: live.s.id } };
  if (!S.ships.length) return { tone: 'gold', ic: 'plus', title: tr('ابدأ أول رحلة استيراد', 'Start your first import shipment'), why: tr('نرتّب لك التمويل والمستندات وACI والإفراج خطوة بخطوة.', 'We line up funding, documents, ACI and release one step at a time.'), label: tr('ابدأ الآن', 'Start now'), act: { type: 'newShip' } };

const hsDigits = (v) => String(v || '').replace(/\D/g, '');

  const a = sh.aci;

  if (sh.imo && !/^\d{7}$/.test(String(sh.imo))) add('err', 'transport', tr('رقم IMO يجب أن يتكون من 7 أرقام', 'The IMO number must have 7 digits'));
  else if (!sh.imo) add('err', 'transport', tr('رقم IMO غير مدخل', 'IMO number is missing'));

  if (!sh.incoterm) add('err', 'finance', tr('شروط التسليم (Incoterms) غير محددة', 'Delivery terms (Incoterms) are not set'));
  if (sh.channel === 'LC' && !sh.lcNo) add('err', 'finance', tr('الرقم المرجعي لخطاب الاعتماد مفقود', 'Credit reference number is missing'));
  if (!sh.valueUsd) add('err', 'finance', tr('قيمة المنتج غير مدخلة', 'Goods value is missing'));
  if (lc && sh.valueUsd) {
    const c = calcLC(lc);
    if (sh.valueUsd > c.max) add('err', 'finance', tr(`قيمة الشحنة ($${nf(sh.valueUsd)}) تتجاوز الحد المسموح للاعتماد ($${nf(c.max)})`, `Shipment value ($${nf(sh.valueUsd)}) exceeds the credit limit ($${nf(c.max)})`), tr(`الاعتماد ${lc.no} بانحراف مسموح ${lc.dev}%`, `Credit ${lc.no} with ${lc.dev}% tolerance`));
    else if (sh.valueUsd > lc.usd) add('warn', 'finance', tr('القيمة أعلى من قيمة الاعتماد لكنها ضمن الانحراف المسموح', 'Value is above the credit amount but within the allowed tolerance'));

    const n = tr(`الصنف ${i + 1}`, `Item ${i + 1}`);
    if (!it.desc) add('err', 'items', tr(`${n}: الوصف التجاري مفقود`, `${n}: commercial description is missing`));
    if (hsDigits(it.hs).length < 6) add('err', 'items', tr(`${n}: رمز HS يجب ألا يقل عن 6 أرقام`, `${n}: HS code needs at least 6 digits`));
    if (!it.origin) add('err', 'items', tr(`${n}: بلد المنشأ مفقود`, `${n}: country of origin is missing`));
    if (!(num(it.pkgs) > 0)) add('err', 'items', tr(`${n}: عدد الطرود مفقود`, `${n}: number of packages is missing`));
    if (!(num(it.gross) > 0) || !(num(it.net) > 0)) add('err', 'items', tr(`${n}: الوزن الإجمالي أو الصافي مفقود`, `${n}: gross or net weight is missing`));
    else if (num(it.net) > num(it.gross)) add('err', 'items', tr(`${n}: الوزن الصافي أكبر من الإجمالي`, `${n}: net weight is greater than gross`));
  });
  if (!sh.containers.length) add('err', 'containers', tr('لا توجد حاويات مسجلة', 'No containers entered'));
  sh.containers.forEach((c) => {
    const n = c.no || tr('حاوية', 'Container');
    if (!validContainer(c.no)) add('err', 'containers', tr(`رقم الحاوية «${c.no || '—'}» غير صحيح`, `Container number “${c.no || '—'}” is not valid`), tr('يُفحص رقم التحقق وفق معيار ISO 6346', 'The check digit is verified per ISO 6346'));

    if (!(num(c.gross) > num(c.tare))) add('err', 'containers', tr(`${n}: الوزن الإجمالي يجب أن يزيد عن الفارغ`, `${n}: gross weight must exceed tare`));

    const cargo = sum(sh.containers.map((c) => num(c.gross) - num(c.tare)));
    const decl = sum(sh.items.map((i) => num(i.gross)));
    if (decl > 0) {
      const diff = Math.abs(cargo - decl) / decl;
      if (diff > 0.05) add('err', 'containers', tr(`وزن الحاويات (${nf(cargo)} كجم) لا يطابق أوزان الأصناف (${nf(decl)} كجم)`, `Container weight (${nf(cargo)} kg) does not match item weights (${nf(decl)} kg)`));
      else if (diff > 0.02) add('warn', 'containers', tr(`فرق ${(diff * 100).toFixed(1)}% بين وزن الحاويات وأوزان الأصناف`, `${(diff * 100).toFixed(1)}% difference between container and item weights`));
    }
    const pc = sum(sh.containers.map((c) => num(c.pkgs)));
    const pi = sum(sh.items.map((i) => num(i.pkgs)));
    if (pc !== pi) add('err', 'containers', tr(`عدد الطرود في الحاويات (${nf(pc)}) لا يساوي عددها في الأصناف (${nf(pi)})`, `Packages in containers (${nf(pc)}) differ from items (${nf(pi)})`));

  const r = aciRisk(sh);
  if (r) add(r.tone === 'info' ? 'warn' : 'err', 'timing', r.text, tr(`الموعد النهائي ${fmtDate(r.dead)}`, `Deadline ${fmtDate(r.dead)}`));

}
function aciCompleteness(sh) {
  const errs = aciChecks(sh).filter((c) => c.lvl === 'err');
  const req = 3 + 1 + 10 + 1 + 3 + 2 + Math.max(1, sh.items.length) * 5 + Math.max(1, sh.containers.length) * 3 + 4;
  return clamp(Math.round((1 - errs.length / req) * 100), 0, 100);
}

/* Reads a portal e-mail / notification and maps it to an ACI status (rule based, no network) */
function parsePortalMessage(text) {
  const t = String(text || '').replace(/[ً-ٟـ]/g, '');
  const rules = [
    [/مفرج\s*عنه|\breleased\b/i, 'released'],
    [/مراجعة\s*بوليصة|بوليصة\s*الشحن\s*المعتمدة|bill of lading.*(review|under)/i, 'bl_review'],
    [/في\s*انتظار\s*بوليصة|awaiting.*(bill|b\/l)|waiting.*bill of lading/i, 'awaiting_bl'],
    [/مكتمل|\bcompleted\b/i, 'completed'],
    [/استفسار|\bquery\b|\binquiry\b/i, 'supplier_completion'],
    [/مراجعة\s*الجمارك|customs\s*review/i, 'customs_review'],
    [/استكمال|complete\s+the\s+remaining/i, 'supplier_completion'],
    [/(تحقق|مراجعة|موافقة).*(المستورد|التفاصيل)|importer.*(verify|review)|verify.*(details|data)/i, 'importer_review'],
  ];
  let status = null;
  for (const [re, s] of rules) { if (re.test(t)) { status = s; break; } }
  const m = /(?:ACI|رقم\s*ACI)\s*(?:number|no\.?|رقم)?\s*[:#：\-]?\s*((?=[A-Z0-9-]*\d)[A-Z0-9][A-Z0-9-]{5,})/i.exec(t);
  return { status, number: m ? m[1].toUpperCase() : null };
}

/* ---------- invoice vs inspection certificate ---------- */
const MATCH_FIELDS = [
  { k: 'supplier', n: T2('المورد', 'Supplier'), t: 'text' },
  { k: 'desc', n: T2('وصف السلعة', 'Goods description'), t: 'text' },
  { k: 'qty', n: T2('الكمية', 'Quantity'), t: 'num', tol: 0 },
  { k: 'gross', n: T2('الوزن كجم', 'Weight kg'), t: 'num', tol: 0.01 },
  { k: 'value', n: T2('القيمة USD', 'Value USD'), t: 'num', tol: 0.005 },
  { k: 'origin', n: T2('بلد المنشأ', 'Origin'), t: 'text' },
];
const NOISE = new Set(['co', 'ltd', 'llc', 'inc', 'corp', 'pvt', 'sa', 'as', 'srl', 'spa', 'sas', 'gmbh', 'company', 'limited', 'the', 'and', 'of', 'شركة']);

const tokens = (s) => new Set(normText(s).split(' ').filter((w) => w && !NOISE.has(w)).map((w) => (w.length > 3 && w.endsWith('s') ? w.slice(0, -1) : w)));

  const x = normText(a), y = normText(b);
  if (!x || !y) return false;
  if (x === y) return true;
  const A = tokens(a), B = tokens(b);
  if (!A.size || !B.size) return false;
  let inter = 0;
  A.forEach((w) => { if (B.has(w)) inter++; });
  return inter / Math.max(A.size, B.size) >= 0.6;
}
function matchDocs(inv, cert) {
  return MATCH_FIELDS.map((f) => {
    const a = inv[f.k], b = cert[f.k];
    let ok;
    if (f.t === 'num') {
      const x = num(a), y = num(b);
      ok = x > 0 && y > 0 && Math.abs(x - y) <= Math.max(x, y) * f.tol;
    } else ok = textMatch(a, b);
    return { ...f, name: L(f.n), ok, a, b };

}

/* 34-sanitize.js */
/* ---------- data integrity: everything that enters the app from outside (this device's storage, a backup file, the cloud)
   passes through here, so one malformed record cannot crash a screen, poison a calculation or inject markup. ---------- */
const MAX_STR = 2000;
const MAX_ITEMS = 3000;
const ISO_DAY = /^\d{4}-\d{2}-\d{2}$/;
const FORBIDDEN_KEYS = new Set(['__proto__', 'constructor', 'prototype']);
const isObj = (x) => x !== null && typeof x === 'object' && !Array.isArray(x);

/* deep copy that keeps only plain JSON: bounded depth, string length and array size; no prototype keys; finite numbers */
function scrub(x, depth = 0) {
  if (x === null) return null;
  const t = typeof x;
  if (t === 'string') return x.length > MAX_STR ? x.slice(0, MAX_STR) : x;
  if (t === 'number') return Number.isFinite(x) ? x : 0;
  if (t === 'boolean') return x;
  if (t !== 'object' || depth > 8) return undefined;
  if (Array.isArray(x)) return x.slice(0, MAX_ITEMS).map((v) => scrub(v, depth + 1)).filter((v) => v !== undefined);
  const o = {};
  for (const k of Object.keys(x)) {
    if (FORBIDDEN_KEYS.has(k)) continue;
    const v = scrub(x[k], depth + 1);
    if (v !== undefined) o[k] = v;
  }
  return o;
}

const sStr = (v, max = 300) => (typeof v === 'string' ? v : v == null ? '' : typeof v === 'number' || typeof v === 'boolean' ? String(v) : '').slice(0, max);
const sNum = (v, min = -Infinity, max = Infinity, dflt = 0) => { const n = typeof v === 'number' ? v : parseFloat(v); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : dflt; };
const sDay = (v) => (typeof v === 'string' && ISO_DAY.test(v) && !Number.isNaN(Date.parse(v)) ? v : '');
const sBi = (v) => (isObj(v) ? { ar: sStr(v.ar, 400), en: sStr(v.en, 400) } : sStr(v, 400)); /* a bilingual title or a plain string */
const sEnum = (v, list, dflt) => (list.includes(v) ? v : dflt);
const sObjList = (v, fn, max = 500) => (Array.isArray(v) ? v.slice(0, max).filter(isObj).map(fn) : []);

const LC_STATUSES = ['draft', 'submitted', 'awaiting_cover', 'issued', 'closed'];
const CHANNELS = ['LC', 'TRANSFER', 'SOLE'];

function normLc(x) {
  if (!isObj(x) || !sStr(x.no, 40).trim()) return null;
  return {
    ...scrub(x),
    no: sStr(x.no, 40).trim(), desc: sBi(x.desc), bank: sStr(x.bank, 20), open: sDay(x.open) || iso(TODAY),
    days: Math.round(sNum(x.days, 1, 3650, 60)), usd: sNum(x.usd, 0, 1e12), rate: sNum(x.rate, 0.0001, 1000, RATE.avg), cover: sNum(x.cover, 0, 100, 100), dev: sNum(x.dev, 0, 100, 0),
    status: sEnum(x.status, LC_STATUSES, 'draft'), paid: sNum(x.paid, 0, 1e15), invoices: (Array.isArray(x.invoices) ? x.invoices.slice(0, 500) : []).map((n) => sNum(n, 0, 1e12)),
    sector: sEnum(x.sector, Object.keys(SECTORS), 'commercial'), supplier: sStr(x.supplier, 200),
  };
}
function normShip(x) {
  if (!isObj(x) || !sStr(x.id, 60).trim()) return null;
  const a = isObj(x.aci) ? x.aci : {};
  const sup = isObj(x.supplier) ? x.supplier : {};
  const docs = {};
  if (isObj(x.docs)) for (const k of Object.keys(x.docs)) { if (!FORBIDDEN_KEYS.has(k) && isObj(x.docs[k])) docs[k] = { ...scrub(x.docs[k]), file: sStr(x.docs[k].file, 260), at: sDay(x.docs[k].at) }; }
  const manual = {};
  if (isObj(x.manual)) for (const k of Object.keys(x.manual)) { if (!FORBIDDEN_KEYS.has(k)) manual[k] = !!x.manual[k]; }
  return {

/* swipe-to-confirm: the thumb starts at the reading-start side and travels toward the end side */
function swipeConfirm(label, onDone) {
  const rtl = isRTL();
  const root = h('div', { class: 'swipe' + (rtl ? '' : ' fwd'), role: 'group' });
  const fill = h('div', { class: 'fill' });
  const tx = h('div', { class: 'tx' }, label);
  const th = h('button', { class: 'th', type: 'button', 'aria-label': label }, icon('fwd'));
  root.append(fill, tx, th);
  let drag = false, sx = 0, max = 0, done = false;
  const sign = rtl ? -1 : 1;
  const finish = () => {
    if (done) return;
    done = true; root.classList.add('done');
    th.style.transform = `translateX(${sign * max}px)`; fill.style.width = '100%';
    clear(th).append(icon('check'));
    tx.textContent = tr('تم', 'Done');
    vibrate(24);
    setTimeout(onDone, 260);
  };
  const delta = (e) => clamp(rtl ? sx - e.clientX : e.clientX - sx, 0, max);
  th.addEventListener('pointerdown', (e) => { if (done) return; drag = true; sx = e.clientX; max = root.clientWidth - th.clientWidth - 8; th.setPointerCapture(e.pointerId); th.style.transition = 'none'; fill.style.transition = 'none'; });
  th.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = delta(e);
    th.style.transform = `translateX(${sign * dx}px)`; fill.style.width = dx + 48 + 'px';
    tx.style.opacity = String(1 - dx / max);
  });
  const end = (e) => {
    if (!drag) return;
    drag = false;
    const dx = delta(e);
    th.style.transition = 'transform .3s'; fill.style.transition = 'width .3s';
    if (dx / max > 0.82) finish();
    else { th.style.transform = ''; fill.style.width = '0'; tx.style.opacity = '1'; }
  };
  th.addEventListener('pointerup', end);
  th.addEventListener('pointercancel', end);
  th.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); max = root.clientWidth - th.clientWidth - 8; finish(); } });
  return root;
}

  const body = h('div', { class: 'sheet-body' });

  wrap.append(bg, sheet);
  $('#layer').append(wrap);
  const ctrl = {
    el: wrap, body,
    close() {
      if (ctrl.closed) return;
      ctrl.closed = true;
      wrap.classList.remove('in');
      UI.sheets = UI.sheets.filter((s) => s !== ctrl);
      setTimeout(() => wrap.remove(), 420);

      body.scrollTop = st;

  };

  bg.onclick = ctrl.close;
  let dragging = false, y0 = 0, dy = 0, t0 = 0;
  grab.addEventListener('pointerdown', (e) => { dragging = true; y0 = e.clientY; t0 = performance.now(); sheet.classList.add('drag'); grab.setPointerCapture(e.pointerId); });
  grab.addEventListener('pointermove', (e) => { if (!dragging) return; dy = Math.max(0, e.clientY - y0); sheet.style.transform = `translateY(${dy}px)`; });
  const endDrag = () => {
    if (!dragging) return;
    dragging = false; sheet.classList.remove('drag');

  return ctrl;
}

/* ---------- finance: credits (LCs) ---------- */
function countTo(node, to, d = 0) {
  const from = parseFloat(node.dataset.v || 0) || 0;
  node.dataset.v = to;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { node.textContent = nf(to, d); return; }
  let t0 = null;
  const step = (t) => {
    t0 = t0 || t;
    const p = Math.min(1, (t - t0) / 900), e = 1 - Math.pow(1 - p, 3);

  const p = openPage('newlc', () => {
    const fld = (id, label, input, w2, hint) => h('div', { class: 'field' + (w2 ? ' w2' : '') }, h('label', { for: id }, label), input, hint ? h('span', { class: 'hint' }, hint) : null);

    const sel = (id, k, opts) => h('select', { id, onchange: (e) => { f[k] = e.target.value; paint(); } }, opts.map((o) => h('option', { value: o.v, selected: o.v === f[k] }, o.t)));
    const calc = () => {

      return { usd, rate, lyd: usd * rate, cov: (usd * rate * cover) / 100, due: addDays(TODAY, days), max: usd * (1 + dev / 100), min: usd * (1 - dev / 100), cover, days, dev };
    };
    const panel = () => {

      const cap = f.sector === 'industrial' ? 10000000 : f.sector === 'services' ? 3000000 : 5000000;
      if (c.usd > cap) warns.push(tr(`القيمة تتجاوز سقف الاعتماد الواحد المعلن لقطاع «${sectorName(f.sector)}» ($${nf(cap)} في ضوابط 2020، وتعليق آخر يذكر أرقامًا مختلفة).`, `The value exceeds the reported single-credit ceiling for “${sectorName(f.sector)}” ($${nf(cap)} in the 2020 controls; another commentary gives different figures).`));

/* ---------- backup (works without any cloud) ---------- */
function downloadJson(obj, name) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const a = h('a', { href: URL.createObjectURL(blob), download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
const backupName = (tag) => `${BRAND_ID}-${tag}-${new Date().toISOString().slice(0, 10)}.json`;
function exportBackup() { downloadJson({ app: 'importer-companion', exportedAt: new Date().toISOString(), data: S }, backupName('backup')); }
/* a copy kept aside when the cloud replaced this device's unsynced edits, or when stored data could not be read */
function exportStash(why) {
  const raw = readStash(why);
  let data = null;
  try { data = JSON.parse(raw); } catch (e) { /* hand over the raw text below */ }
  if (data) downloadJson({ app: 'importer-companion', exportedAt: new Date().toISOString(), data }, backupName(why));
  else { const blob = new Blob([raw || ''], { type: 'text/plain' }); const a = h('a', { href: URL.createObjectURL(blob), download: backupName(why).replace('.json', '.txt') }); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
}
function importBackup() {
  if (Cloud.orgId() && Cloud.role() === 'viewer') return toast(tr('أنت مشاهد ولا تملك صلاحية الاسترجاع', 'You are a viewer and cannot restore'));
  const inp = h('input', { type: 'file', accept: '.json,application/json', style: { display: 'none' } });
  inp.addEventListener('change', async () => {
    const f = inp.files && inp.files[0]; inp.remove();
    if (!f) return;
    try {
      if (f.size > 5e6) throw new Error('size');
      const o = JSON.parse(await f.text());
      const res = normalizeState(o && o.data);
      if (!res.state) throw new Error('shape');
      if (Cloud.orgId() && res.state.mode === 'demo') return toast(tr('لا يمكن استرجاع نسخة تجريبية داخل نشاطك الفعلي', 'A demo backup cannot be restored into your own business'));
      S = { ...res.state, onboarded: true };
      saveState(); closeAllPages(); rerender();
      toast(res.dropped ? tr(`تم الاسترجاع. تخطينا ${res.dropped} سجلًا غير صالح.`, `Restored. ${res.dropped} invalid record(s) were skipped.`) : tr('تم استرجاع النسخة', 'Backup restored'));
    } catch (e) { toast(tr('الملف ليس نسخة احتياطية صالحة', 'That file is not a valid backup')); }
  });
  document.body.append(inp); inp.click();
}

  }

  if (!Cloud.orgId()) {
    card.append(row(tr('المزامنة', 'Sync'), tr('تبدأ عند حفظ بياناتك الفعلية. إن دُعيت إلى منشأة فافحص الدعوات.', 'Starts once you save your own data. If you were invited to a business, check for invitations.'), h('button', { class: 'chip', type: 'button', onclick: async () => { if (!(await offerInvites())) toast(tr('لا توجد دعوات', 'No invitations')); } }, tr('افحص الدعوات', 'Check invitations'))), backup);
    return card;
  }

  card.append(row(tr('صلاحيتك', 'Your role'), null, pill(roleName(Cloud.role()), Cloud.role() === 'owner' ? 'gold' : 'info')));
  const team = h('div', { class: 'col', style: { gap: '4px' } }, h('span', { class: 'lbl' }, tr('جارٍ تحميل الفريق…', 'Loading the team…')));
  card.append(h('div', { class: 'h3', style: { marginTop: '6px' } }, tr('الفريق', 'Team')), team);
  (async () => {
    try {
      const [ms, invs] = await Promise.all([Cloud.members(), canManageTeam() ? Cloud.invites() : Promise.resolve([])]);
      const me = Cloud.user().uid;
      const redraw = () => { rerender(); };
      clear(team).append(
        ms.map((m) => row(m.displayName || m.email || m.phone || tr('عضو', 'Member'), (m.uid === me ? tr('أنت · ', 'You · ') : '') + roleName(m.role),
          m.uid !== me && Cloud.role() === 'owner' && m.role !== 'owner'
            ? h('div', { class: 'row' },
              h('select', { 'aria-label': tr('الصلاحية', 'Role'), style: { height: '34px', borderRadius: '10px', background: 'var(--field)', border: '1px solid var(--line)', padding: '0 8px', color: 'inherit' }, onchange: async (e) => { await Cloud.setRole(m.uid, e.target.value); redraw(); } }, ROLES.filter((r) => r.id !== 'owner').map((r) => h('option', { value: r.id, selected: r.id === m.role }, L(r.n)))),
              h('button', { class: 'ibtn', type: 'button', 'aria-label': tr('إزالة', 'Remove'), onclick: async () => { await Cloud.removeMember(m.uid); redraw(); } }, icon('trash')))
            : null)),
        invs.filter((i) => i.status === 'pending').map((i) => row(h('span', { class: 'ltr' }, i.key), tr('دعوة معلّقة · ', 'Pending invitation · ') + roleName(i.role),
          h('div', { class: 'row' },
            h('button', { class: 'ibtn', type: 'button', 'aria-label': tr('نسخ رسالة الدعوة', 'Copy the invitation message'), onclick: async () => { await copyText(tr(`دعوتك إلى ${S.org.name} على ${B()}: ${location.href.split('#')[0]} · ادخل بنفس ${i.key}`, `You are invited to ${S.org.name} on ${B()}: ${location.href.split('#')[0]} · sign in with ${i.key}`)); toast(tr('تم نسخ الرسالة', 'Message copied')); } }, icon('copy')),
            h('button', { class: 'ibtn', type: 'button', 'aria-label': tr('إلغاء الدعوة', 'Cancel the invitation'), onclick: async () => { await Cloud.revokeInvite(i.key); redraw(); } }, icon('x'))))),
        canManageTeam() ? h('button', { class: 'btn ghost block', type: 'button', style: { marginTop: '8px' }, onclick: () => openInviteSheet(redraw) }, icon('plus'), tr('دعوة عضو', 'Invite someone')) : null);
    } catch (e) { clear(team).append(h('span', { class: 'lbl' }, tr('تعذر تحميل الفريق.', 'Could not load the team.'))); }
  })();
  card.append(backup);
  return card;
}

  clear(el).append(
    h('div', { class: 'brand' }, h('div', { class: 'logo-mark' }, brandMark()), h('span', null, B())),
    h('h1', null, tr('استورد إلى ليبيا ', 'Import into Libya '), h('em', null, tr('بخطوة واحدة واضحة في كل مرة.', 'with one clear step at a time.'))),
    h('p', { class: 'lead' }, tr('بعد القرار 449 صار الاستيراد للتجارة يمر عبر القنوات المصرفية وثلاث بوابات حكومية لا رابط بينها. نجمعها لك في رحلة واحدة ونخبرك بما عليك فعله الآن، قبل أن يوقف شحنتك أي خطأ.', 'After Decision 449, importing for trade goes through banking channels and three unconnected government portals. We bring them into one journey and tell you what to do now, before a mistake holds your shipment.')),

      item('shield', tr('نفحص قبل أن تفحصك البوابات', 'We check before the portals do'), tr('رموز HS وأرقام الحاويات (ISO 6346) وتطابق القيمة مع الاعتماد.', 'HS codes, container numbers (ISO 6346) and value against the credit.')),
      item('globe', tr('عربي وإنجليزي، على هاتفك', 'Arabic and English, on your phone'), tr('يعمل مع ضعف الإنترنت، ويحفظ بياناتك على جهازك أو حسابك.', 'Works on a weak connection and saves to your device or your account.'))),
    h('p', { class: 'fine' }, tr('نموذج تجريبي لتطبيق مرافق للمستورد. ليس جهة رسمية ولا يرتبط بالجمارك أو المصرف المركزي أو شبكة ليبيا للتجارة.', 'A prototype of an importer companion app. Not an official body and not connected to Customs, the Central Bank or the Libya Trade Network.')));

/* ---------- cloud boot: never blocks first paint; safe to retry ---------- */
let cloudBooting = false;
async function bootCloud(manual) {
  if (cloudBooting || !Cloud.available()) return;
  cloudBooting = true;
  try {
    const r = await Cloud.init();
    if (r === 'loaded') {
      const o = $('.onb'); if (o) o.remove();
      UI.onb = null;
      applyTheme(S.theme);
      buildDock(); go(UI.tab);
    } else if (r === 'empty') {
      if (S.onboarded && S.mode === 'live') await Cloud.createOrgFromState();
      else await offerInvites();
      rerender();
    } else if (manual) {
      toast(tr('تعذر الاتصال بالسحابة. نواصل على جهازك.', 'Could not reach the cloud. Continuing on your device.'));
    }
    if (UI.pages.some((p) => p.key === 'settings')) rerender();
  } catch (e) {
    console.warn('cloud boot failed', e);
  } finally { cloudBooting = false; }
}

/* ---------- boot ---------- */
function init() {
  applyLang(detectLang());
  S = loadLocal() || emptyState();
  if (S.onboarded) syncProfileFromDocs();
  document.title = `${B()} · ${brandTag()}`;
  applyTheme(S.theme);

  const screens = $('#screens');
  TAB_IDS.forEach((id) => screens.append(h('section', { class: 'screen', 'data-tab': id, id: 'screen-' + id, role: 'tabpanel', 'aria-labelledby': 'tab-' + id, hidden: id !== UI.tab })));
  refreshStory();
  buildDock();
  const hash = location.hash.replace('#', '');
  go(TAB_IDS.includes(hash) ? hash : 'home');
  if (!S.onboarded) startOnboarding();

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (!closeTopSheet() && UI.pages.length) closePage();
  });
  matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { if (!S.theme) rerender(); });
  window.addEventListener('online', () => { if (!Cloud.signedIn()) bootCloud(); });
  const flushNow = () => { if (Cloud.active() && !Cloud.readOnly()) Cloud.flush().catch(() => { /* retried on the next change */ }); };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushNow(); });
  window.addEventListener('pagehide', flushNow);

  bootCloud();

  if (!window.__EMBED__ && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* offline cache is optional */ });
  }
}
init();

})();
